#cloud-config
# The user data of a cloud agent (decision O6): a text/template of woodpecker-ci/autoscaler, where .Image
# is the agent image and .Environment holds WOODPECKER_SERVER, the agent's own token and its labels.
# The server boots from the snapshot (nerva-autoscaler-image.sh), which already holds Docker with the
# io_uring seccomp profile, the images and the warm cache: nothing is installed here.
write_files:
- path: /root/docker-compose.yml
  permissions: '0600'
  content: |
    services:
      woodpecker-agent:
        image: {{ .Image }}
        restart: always
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock
        environment:
          {{- range $key, $value := .Environment }}
          - {{ $key }}={{ $value }}
          {{- end }}
runcmd:
  # Before any job can run: containers cannot reach the metadata service (the snapshot's unit; the user data
  # holds the agent token). The unit is enabled in the snapshot; this makes sure it is in place first.
  - systemctl start nerva-ci-metadata-block.service
  {{- range .PreExec }}
  - {{ . }}
  {{- end }}
  - docker compose -f /root/docker-compose.yml up -d
  # The token is in the agent container now: delete cloud-init's copies of it (the metadata service keeps its own).
  - rm -f /root/docker-compose.yml /var/lib/cloud/instance/user-data.txt /var/lib/cloud/instance/user-data.txt.i /var/lib/cloud/instance/cloud-config.txt
  {{- range .PostExec }}
  - {{ . }}
  {{- end }}
