#cloud-config
# The user data of a cloud agent (decision O6): a text/template of woodpecker-ci/autoscaler, where .Image
# is the agent image and .Environment holds WOODPECKER_SERVER, the agent's own token and its labels.
# The server boots from the snapshot (nerva-autoscaler-image.sh), which already holds Docker with the
# io_uring seccomp profile, the images and the warm cache: nothing is installed here.
write_files:
- path: /root/docker-compose.yml
  permissions: '0600'
  content: |
    services:
      woodpecker-agent:
        image: {{ .Image }}
        restart: always
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock
        environment:
          {{- range $key, $value := .Environment }}
          - {{ $key }}={{ $value }}
          {{- end }}
runcmd:
  {{- range .PreExec }}
  - {{ . }}
  {{- end }}
  # Fails closed: the agent starts only if containers cannot reach the metadata service (the snapshot's unit, and
  # the DOCKER-USER rule in place: the user data holds the agent token). If any step fails, the server powers
  # itself off: it takes no job, deletes nothing, and the autoscaler reaps a server whose agent never connects.
  # One list item, so the && chain and the || are one shell command (runcmd lines do not stop on failure).
  - systemctl start nerva-ci-metadata-block.service && iptables -w -C DOCKER-USER -d 169.254.169.254 -j DROP && docker compose -f /root/docker-compose.yml up -d || poweroff
  # The token is in the agent container now: delete cloud-init's copies of it (the metadata service keeps its own; obj.pkl is the pickled datasource, user data
  # included, and cloud-init rebuilds it at the next boot).
  - rm -f /root/docker-compose.yml /var/lib/cloud/instance/user-data.txt /var/lib/cloud/instance/user-data.txt.i /var/lib/cloud/instance/cloud-config.txt /var/lib/cloud/instance/obj.pkl
  {{- range .PostExec }}
  - {{ . }}
  {{- end }}
