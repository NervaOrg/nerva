# Linux packaging (v0.7.1, slice 4; docs/briefs/v0.7.1.md): the release tarball's install.sh and
# the two systemd units, proved on a real systemd; and slice 5's .deb and .rpm packages.
#
# It runs on every push to main (so on the release commit), is called by release.yml, whose draft
# waits for it on the release commit itself (#384), and runs on a pull request whose change the
# classifier (.github/scripts/classify_changes.sh, decision O14) says can affect it: `all`,
# `binary` (any of src/, build.zig, VERSION, the toolchain: the installer and units rely on the
# binary's output and exit statuses) or `packaging` (packaging/, tests/packaging/, this workflow,
# its scripts, docs/INSTALL.md). A draft's run waits until the pull request is marked ready. It
# replaces a hand-written `paths:` list that missed what the classifier knows (#13). Every job runs
# on GitHub's hosted runners, as ci.yml's do (P147e): a test that installs a service and starts
# replicas as root needs a machine of its own, and a fork's pull request must never run on a
# self-hosted one. The pinned toolchain comes from Actions' cache, installed as ci.yml installs it.
# This workflow is not a required check: a pull request whose class is false skips its jobs.
name: Packages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  # release.yml calls it on the release commit and does not publish until it is green (#384, P386).
  workflow_call:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:

  # Whether a pull request's change can affect these jobs. Anything but a pull request runs them;
  # a list that cannot be had fails closed (the classifier prints every class true).
  classify:
    name: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.classify.outputs.run }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Classify the change (.github/scripts/classify_changes.sh)
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          CHANGED: ${{ github.event.pull_request.changed_files }}
        run: |
          if [ "$EVENT" = pull_request ] && [ -n "$PR" ] \
             && gh api "repos/${{ github.repository }}/pulls/$PR/files" --paginate \
                  --jq '.[].filename' > files.txt; then
            .github/scripts/classify_changes.sh --expect "${CHANGED:-}" < files.txt > classes.txt
          else
            .github/scripts/classify_changes.sh --all < /dev/null > classes.txt
          fi
          cat classes.txt
          if grep -qx -e all=true -e binary=true -e packaging=true classes.txt; then run=true; else run=false; fi
          echo "run=$run" | tee -a "$GITHUB_OUTPUT"

  # The tarball's install.sh and units, under systemd as root on the runner (tests/packaging/
  # install.py): install, idempotence, every NRV-E11xx, three replicas and a gateway, a SIGKILL,
  # a replica that exits 8, uninstall. It changes /usr/local/bin, /etc and /var/lib: the runner is
  # thrown away after the job.
  tarball:
    name: tarball installs
    needs: classify
    # A draft pull request waits for ready_for_review; every other event runs. A failed
    # `classify` runs the job (an empty output is not 'false').
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && needs.classify.outputs.run != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - uses: actions/cache@v4
        with:
          path: ~/.cache/nerva-toolchain
          key: nerva-toolchain-v2-${{ runner.os }}-${{ hashFiles('zig/download.sh') }}

      - name: Install the pinned Zig
        run: ci/install_zig.sh

      - name: Build nerva (the release build the tarball carries)
        run: ./zig/zig build -Drelease

      - name: The runner boots with systemd
        run: |
          systemd-analyze --version | head -n1
          test -d /run/systemd/system

      - name: Install and run (tests/packaging/install.py)
        run: sudo python3 -I tests/packaging/install.py zig-out/bin/nerva packaging/linux

  # The .deb and .rpm (tests/packaging/packages.py, v0.7.1 slice 5): both packages for both
  # architectures built twice with dpkg-deb and rpmbuild (reproducible), inspected, and installed,
  # reinstalled and removed in ubuntu:24.04, debian:12, rockylinux:9 and fedora:latest. The two
  # tools are the owner's approved dependency (P284b): dpkg-deb is part of the image, rpmbuild is
  # the `rpm` package, pinned to the version the image's apt index offered when this was written
  # (4.18.2, the one on ubuntu-24.04) and asserted, so an image change fails here and does not
  # silently change the bytes. The four container images are public and pulled here only.
  # release.yml (slice 7) runs the same scripts: packaging/linux/build-deb.sh and build-rpm.sh.
  packages:
    name: deb and rpm
    needs: classify
    # A draft pull request waits for ready_for_review; every other event runs. A failed
    # `classify` runs the job (an empty output is not 'false').
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && needs.classify.outputs.run != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - uses: actions/cache@v4
        with:
          path: ~/.cache/nerva-toolchain
          key: nerva-toolchain-v2-${{ runner.os }}-${{ hashFiles('zig/download.sh') }}

      - name: Install the pinned Zig
        run: ci/install_zig.sh

      # Each package carries the binary built for its own architecture; the build scripts read the
      # ELF header and refuse another (NRV-E1110), and packages.py compares the bytes.
      - name: Build nerva for x86_64-linux and aarch64-linux (the release builds the packages carry)
        run: |
          ./zig/zig build -Drelease
          ./zig/zig build -Drelease -Dtarget=aarch64-linux -p zig-out-aarch64

      - name: Install rpmbuild, pinned
        run: |
          set -eu
          sudo apt-get -o Acquire::Retries=5 update -qq
          sudo apt-get -o Acquire::Retries=5 install -y -qq rpm=4.18.2+dfsg-2.1build2
          rpmbuild --version
          test "$(rpmbuild --version)" = "RPM version 4.18.2"
          dpkg-deb --version | head -n1

      - name: Build, inspect and install the packages (tests/packaging/packages.py)
        run: python3 -I tests/packaging/packages.py zig-out/bin/nerva . --aarch64 zig-out-aarch64/bin/nerva --require-version-line

      # The signed repositories (slice 2): three trees built by package_repos.sh with throwaway
      # keys, served over local HTTP, and installed from by repo_install_check.sh in a container
      # per distribution (apt, dnf 4 and dnf 5), with the refusals and the dual-signed InRelease.
      # The tools are pinned as ci.yml pins them. The images are tags here; slice 4 pins them by
      # digest in release-finish.yml's `repos-verify`.
      - name: Install from the signed repositories on seven distributions (tests/packaging/repos.py)
        run: |
          set -eu
          sudo apt-get -o Acquire::Retries=5 install -y -qq apt-utils=2.8.4ubuntu0.1 \
            createrepo-c=0.17.3-2ubuntu3 rpm=4.18.2+dfsg-2.1build2 sqv=1.1.0-1build2 gnupg jq
          tool_is() { # <tool> <expected first line>
            got=$("$1" --version 2>&1 | head -n1)
            case $got in "$2" | "$2"[!0-9.]*) ;; *) echo "error[NRV-E1139]: packages.yml: $1 reads '$got', not '$2'" >&2; exit 1 ;; esac
          }
          tool_is apt-ftparchive "apt 2.8.4"
          tool_is createrepo_c "Version: 0.17.3"
          tool_is rpmsign "RPM version 4.18.2"
          gpg --version | head -n1 | grep -q 'gpg (GnuPG) 2\.4\.' || { echo "error[NRV-E1139]: packages.yml: gpg is not 2.4" >&2; exit 1; }
          python3 -I tests/packaging/repos.py
