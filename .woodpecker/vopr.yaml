# Woodpecker, on the project's own machine (ops/ci/README.md, "Nerva on Woodpecker"). Pushes to any
# branch of NervaLog/nerva but jepsen/**, and manual runs without NERVA_RUN: never a pull request,
# so never a fork's code (P147e; the repository's "Allow pull requests" is off as well). The commands are ci/job.sh's, the same as
# ci.yml's job of the same name.
# Branches other than main get a pull request's VOPR: the fixed seeds and one random seed, Debug
# (N74). main gets vopr-main.yaml instead.
matrix:
  SEED: ['1', '2', '5', random]

when:
  - event: push
    branch:
      exclude: [main, 'jepsen/**']
  - event: manual
    branch:
      exclude: main
    evaluate: 'NERVA_RUN == ""'

steps:
  - name: vopr (${SEED})
    image: docker.io/library/ubuntu:24.04@sha256:73b999393d07f2bf65a40373778a44dc9a6d54ad7718d29247d8ff9413c4d6a8
    commands:
      - ci/woodpecker_step.sh vopr "${SEED}"
    # Docker's default seccomp profile refuses io_uring (Docker 25 and later), which Nerva's IO
    # needs; privileged lifts it. The job itself runs as `ci` with no capabilities.
    privileged: true
    volumes:
      - /var/cache/nerva-ci:/cache
