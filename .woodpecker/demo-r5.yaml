# Woodpecker, on the project's own machine (ops/ci/README.md, "Nerva on Woodpecker"). Pushes to any
# branch of NervaOrg/nerva but jepsen/**, and manual runs without NERVA_RUN: never a pull request,
# so never a fork's code (P147e; the repository's "Allow pull requests" is off as well). The
# commands are ci/job.sh's, the same as ci.yml's job of the same name.
# Caches (decision O4): a step for a push to main mounts main's cache writable and no branch's; any
# other step mounts main's read-only and its own branches' directory writable. The two steps are
# exclusive by `when:`, so a branch's pipeline never gets main's cache writable: the mount, not the
# script, enforces it. Steps are not privileged; io_uring comes from the host Docker daemon's
# seccomp profile (ops/ci/docker/README.md).
# Where it runs (decision O6): this workflow is `tier: cloud`, so an on-demand Hetzner agent (ops/ci/autoscaler/)
# or the box may take it. It never runs for a push to main: demo-r5-main.yaml does, on the box, because only a push
# to main may write the shared cache (decision O4) and the cloud agents' copy is thrown away with the server.

labels:
  tier: cloud

when:
  - event: push
    branch:
      exclude: [main, 'jepsen/**']
  - event: manual
    evaluate: 'NERVA_RUN == ""'

steps:
  - name: demo-r5
    image: docker.io/library/ubuntu:24.04@sha256:73b999393d07f2bf65a40373778a44dc9a6d54ad7718d29247d8ff9413c4d6a8
    commands:
      - ci/woodpecker_step.sh demo-r5
    when:
      - evaluate: 'CI_PIPELINE_EVENT != "push" || CI_COMMIT_BRANCH != "main"'
    volumes:
      - /var/cache/nerva-ci/main:/cache/main:ro
      - /var/cache/nerva-ci/locks:/cache/locks
      - /var/cache/nerva-ci/branches:/cache/branches
